<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Plus | Cerrar sesión</title>

    <link rel="stylesheet" href="../CSS/cerrar sesion.css">
</head>

<body>

    <main class="logout-page">

        <section class="logout-card">

            <div class="logout-icon">
                🚪
            </div>

            <h1>¿Cerrar sesión?</h1>

            <p>
                Estás a punto de salir de tu cuenta de <strong>System Plus</strong>.
            </p>

            <div class="logout-actions">
                <button class="btn-cancel" id="cancelLogout">
                    Cancelar
                </button>

                <button class="btn-logout" id="confirmLogout">
                    Cerrar sesión
                </button>
            </div>

        </section>

        <footer>
            <span>SYSTEM PLUS</span>
            <p>Plataforma académica</p>
        </footer>

    </main>

    <script src="../JS/cerrar sesion.js"></script>
</body>
</html>
