<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"href="../CSS/perfil.css">

</head>


<body>


<header class="topbar">

    <div class="brand">
        SYSTEM PLUS
    </div>


    <nav class="header-nav">

        <a href="dashboard.html">
            🏠 Inicio
        </a>

    </nav>


    <a
        href="perfil.html"
        class="user active-user"

        👤 ADMIN
    </a>

</header>



<div class="layout">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

    <nav>

        <a href="dashboard.html" class="sidebar-item">
            🏠 <span>Inicio</span>
        </a>

        <a href="perfil.html" class="sidebar-item">
            👤 <span>Perfil</span>

</aside>



    <!-- =========================

    ========================== -->

    <main class="main-content">


       <section class="heading">

    <div class="heading-top">

        <div>

            <span>CUENTA</span>

            <h1>Información personal</h1>

            <p>
                Consulta la información registrada en tu cuenta académica.
            </p>

        </div>


        <button
            type="button"
            class="back-button"
            onclick="window.location.href='dashboard.html'"
        >
            ← Volver al inicio
        </button>

    </div>

</section>



        <!-- =========================
             INFORMACIÓN PERSONAL
        ========================== -->

        <section class="profile-section">


            <div class="section-header">

                <span>
                    INFORMACIÓN PERSONAL
                </span>

                <h2>
                    Datos personales
                </h2>

            </div>



            <div class="form-grid">


                <!-- PRIMER NOMBRE -->

                <div class="form-group">

                    <label>
                        Primer nombre
                        <b>*</b>
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        value="JUAN"
                        readonly
                    >

                </div>



                <!-- SEGUNDO NOMBRE -->

                <div class="form-group">

                    <label>
                        Segundo nombre
                    </label>

                    <input
                        type="text"
                        id="middleName"
                        value="ESTEBAN"
                        readonly
                    >

                </div>



                <!-- PRIMER APELLIDO -->

                <div class="form-group">

                    <label>
                        Primer apellido
                        <b>*</b>
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        value="ORTIZ"
                        readonly
                    >

                </div>



                <!-- SEGUNDO APELLIDO -->

                <div class="form-group">

                    <label>
                        Segundo apellido
                    </label>

                    <input
                        type="text"
                        id="secondLastName"
                        value="RENDON"
                        readonly
                    >

                </div>



                <!-- TIPO IDENTIFICACIÓN -->

                <div class="form-group">

                    <label>
                        Tipo de identificación
                        <b>*</b>
                    </label>

                    <input
                        type="text"
                        id="documentType"
                        value="T.I."
                        readonly
                    >

                </div>



                <!-- NÚMERO -->

                <div class="form-group">

                    <label>
                        Número de identificación
                        <b>*</b>
                    </label>

                    <input
                        type="text"
                        id="documentNumber"
                        value="1112404597"
                        readonly
                    >

                </div>



                <!-- SEXO -->

                <div class="form-group">

                    <label>
                        Sexo
                        <b>*</b>
                    </label>

                    <input
                        type="text"
                        id="gender"
                        value=""
                        readonly
                    >

                </div>



                <!-- CORREO -->

                <div class="form-group">

                    <label>
                        Correo electrónico
                        <b>*</b>
                    </label>

                    <input
                        type="email"
                        id="email"
                        value=""
                        readonly
                    >

                </div>



                <!-- TELÉFONO -->

                <div class="form-group">

                    <label>
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="phone"
                        value=""

                </div>



                <!-- CELULAR -->

                    <label>
                        Celular
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        value=""

                    >

                </div>



                <!-- FECHA NACIMIENTO -->

                <div class="form-group">

                    <label>
                        Fecha de nacimiento
                        <b>*</b>
                    </label>

                        type="text"
                        id="birthDate"
                        value=""

                <!-- LUGAR NACIMIENTO -->

                <div class="form-group">

                    <label>
                        Lugar de nacimiento
                    </label>

                    <input
                        type="text"
                        id="birthPlace"
                        value="Buga (Valle del Cauca)"

                    <label>

                    </label>

                    <input
                        type="text"

</div>
